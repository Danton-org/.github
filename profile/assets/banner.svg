<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Accent Glowing Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="sub-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Filter for Neon Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>

    <!-- Tech Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="0.7" stroke-opacity="0.45" />
      <circle cx="40" cy="0" r="1.5" fill="#6366f1" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .title {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 58px;
      font-weight: 900;
      letter-spacing: 3px;
    }
    .badge {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .subtitle {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 1px;
    }
    .tagline {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 14px;
      font-weight: 500;
      fill: #94a3b8;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="80" r="140" fill="#6366f1" opacity="0.18" filter="url(#soft-glow)" />
  <circle cx="1020" cy="120" r="160" fill="#06b6d4" opacity="0.15" filter="url(#soft-glow)" />
  <circle cx="620" cy="300" r="180" fill="#a855f7" opacity="0.12" filter="url(#soft-glow)" />

  <!-- Grid Overlay -->
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Decorative Circuit / Node Lines -->
  <g opacity="0.35" stroke="#6366f1" stroke-width="1.2" fill="none">
    <path d="M 80 180 L 180 180 L 220 220 L 320 220" />
    <circle cx="80" cy="180" r="3" fill="#6366f1" />
    <circle cx="320" cy="220" r="3" fill="#8b5cf6" />
    
    <path d="M 1120 180 L 1020 180 L 980 140 L 880 140" />
    <circle cx="1120" cy="180" r="3" fill="#06b6d4" />
    <circle cx="880" cy="140" r="3" fill="#3b82f6" />
  </g>

  <!-- Central Emblem / Hexagon Tech Icon -->
  <g transform="translate(600, 105)">
    <!-- Outer Glow Polygon -->
    <polygon points="0,-48 42,-24 42,24 0,48 -42,24 -42,-24" fill="url(#primary-glow)" opacity="0.3" filter="url(#glow)" />
    <!-- Outer Border Polygon -->
    <polygon points="0,-45 39,-22.5 39,22.5 0,45 -39,22.5 -39,-22.5" fill="#111827" stroke="#6366f1" stroke-width="2.5" />
    <!-- Inner Core Polygon -->
    <polygon points="0,-32 28,-16 28,16 0,32 -28,16 -28,-16" fill="url(#cyan-glow)" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Letter 'D' Tech Icon in Center -->
    <path d="M -12 -18 L 2 -18 C 11 -18 18 -10 18 0 C 18 10 11 18 2 18 L -12 18 Z M -6 -12 L 0 -12 C 7 -12 11 -6 11 0 C 11 6 7 12 0 12 L -6 12 Z" fill="#ffffff" />
  </g>

  <!-- Organization Badge Pill -->
  <g transform="translate(600, 185)">
    <rect x="-135" y="-14" width="270" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.8" />
    <circle cx="-110" cy="0" r="4" fill="#10b981" />
    <text x="-95" y="4" class="badge" fill="#a5b4fc">GITHUB ORGANIZATION</text>
  </g>

  <!-- Organization Title -->
  <g transform="translate(600, 245)">
    <text x="0" y="0" text-anchor="middle" class="title" fill="url(#text-grad)">DANTON-ORG</text>
  </g>

  <!-- Subtitle / Pillars -->
  <g transform="translate(600, 282)">
    <text x="0" y="0" text-anchor="middle" class="subtitle" fill="url(#sub-grad)">
      SOFTWARE ENGINEERING • ARTIFICIAL INTELLIGENCE • GAME DEV
    </text>
  </g>

  <!-- Tagline / Code snippet indicator -->
  <g transform="translate(600, 318)">
    <text x="0" y="0" text-anchor="middle" class="tagline">
      &lt; inovando através de código de alto desempenho &amp; soluções inteligentes /&gt;
    </text>
  </g>

  <!-- Modern Border Stroke around entire banner -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="#374151" stroke-width="1.2" stroke-opacity="0.5" />
</svg>

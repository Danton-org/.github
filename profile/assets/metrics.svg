<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" height="100%">
  <defs>
    <linearGradient id="m-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0e131b" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="accent-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="accent-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>

  <style>
    .card-title { font-family: 'Inter', -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #8b949e; letter-spacing: 1px; text-transform: uppercase; }
    .card-value { font-family: 'Inter', -apple-system, sans-serif; font-size: 26px; font-weight: 800; }
    .card-sub { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12px; fill: #7d8590; }
  </style>

  <!-- Background Base -->
  <rect width="960" height="220" rx="14" fill="url(#m-bg)" stroke="#30363d" stroke-width="1.2" />

  <!-- Section Header -->
  <g transform="translate(30, 36)">
    <circle cx="6" cy="-5" r="4" fill="#6366f1" />
    <text x="20" y="0" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#f0f6fc">
      DANTON-ORG • MÉTRICAS CONSOLIDADAS DA ORGANIZAÇÃO
    </text>
  </g>

  <!-- Metric 1: Repositórios Oficiais -->
  <g transform="translate(30, 60)">
    <rect width="210" height="135" rx="10" fill="url(#card-grad)" stroke="#30363d" stroke-width="1" />
    <text x="18" y="32" class="card-title">Repositórios</text>
    <text x="18" y="70" class="card-value" fill="url(#accent-cyan)">Danton-org</text>
    <text x="18" y="98" class="card-sub">🍏 DietIA</text>
    <text x="18" y="118" class="card-sub">⚔️ CuiaHeads • 🏛️ .github</text>
  </g>

  <!-- Metric 2: Qualidade & CI/CD -->
  <g transform="translate(260, 60)">
    <rect width="210" height="135" rx="10" fill="url(#card-grad)" stroke="#30363d" stroke-width="1" />
    <text x="18" y="32" class="card-title">Qualidade &amp; CI/CD</text>
    <text x="18" y="70" class="card-value" fill="url(#accent-green)">100%</text>
    <text x="18" y="98" class="card-sub">Testes Obrigatórios</text>
    <text x="18" y="118" class="card-sub">Clean Architecture &amp; Lint</text>
  </g>

  <!-- Metric 3: Foco Tecnológico -->
  <g transform="translate(490, 60)">
    <rect width="210" height="135" rx="10" fill="url(#card-grad)" stroke="#30363d" stroke-width="1" />
    <text x="18" y="32" class="card-title">Pilares Tech</text>
    <text x="18" y="70" class="card-value" fill="url(#accent-purple)">IA + Games</text>
    <text x="18" y="98" class="card-sub">FastAPI &amp; WhatsApp</text>
    <text x="18" y="118" class="card-sub">Unity Engine &amp; C#</text>
  </g>

  <!-- Metric 4: Equipe & Contribuidores -->
  <g transform="translate(720, 60)">
    <rect width="210" height="135" rx="10" fill="url(#card-grad)" stroke="#30363d" stroke-width="1" />
    <text x="18" y="32" class="card-title">Contribuidores</text>
    <text x="18" y="70" class="card-value" fill="url(#accent-amber)">4 Core Devs</text>
    <text x="18" y="98" class="card-sub">Engenharia de Software</text>
    <text x="18" y="118" class="card-sub">UFS &amp; Colaboradores</text>
  </g>
</svg>
